<!DOCTYPE html>
<html>
<head>
<title>Letter For Chinnari</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="letter-box">

<h1>💌 Dear Chinnari</h1>

<p id="typing"></p>

<a href="things.html" class="btn">
Continue 🌸
</a>

</div>

<script>

const text = `
There are people who enter our lives...

and then there are people who become a part of our life story.

You became my story.

From childhood memories...

to beach conversations...

to every struggle and every victory...

you have been there.

The last year gave us so many moments.

Late conversations.

Random laughs.

Silent understanding.

Sharing everything.

No matter what changes tomorrow...

you'll always have a place in my happiest memories. ❤️

Happy 20th Birthday Chinnari.
`;

let i=0;

function typeWriter(){

if(i < text.length){

document.getElementById("typing").innerHTML += text.charAt(i);

i++;

setTimeout(typeWriter,40);

}

}

typeWriter();

</script>

</body>
</html>
